<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>browse-cmd</title>
  <style>
    :root {
      --bg: #1e1e2e;
      --bg-darker: #181825;
      --border: #45475a;
      --text: #cdd6f4;
      --text-dim: #a6adc8;
      --green: #a6e3a1;
      --blue: #89b4fa;
      --red: #f38ba8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: ui-monospace, "Cascadia Code", "JetBrains Mono", Menlo, monospace;
      font-size: 14px;
      display: flex;
      flex-direction: column;
    }
    /* Barre de titre */
    .titlebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: var(--bg-darker);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .logo {
      color: var(--green);
      font-weight: bold;
      font-size: 13px;
    }
    .btns { display: flex; gap: 4px; }
    .btn {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text-dim);
      width: 28px;
      height: 24px;
      cursor: pointer;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    .btn:hover { background: #313244; color: var(--text); }
    .btn-close:hover { background: var(--red); color: var(--bg); border-color: var(--red); }
    /* Zone de sortie */
    .output {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      line-height: 1.5;
    }
    .line { margin: 0; }
    .cmd { color: var(--blue); }
    .out { color: var(--text); white-space: pre-wrap; }
    .err { color: var(--red); white-space: pre-wrap; }
    /* Menu de suggestions */
    .suggest {
      display: none;
      border-top: 1px solid var(--border);
      background: var(--bg-darker);
      max-height: 120px;
      overflow-y: auto;
      flex-shrink: 0;
    }
    .suggest-item {
      padding: 4px 16px;
      cursor: pointer;
      color: var(--text-dim);
    }
    .suggest-item:hover, .suggest-active {
      background: #313244;
      color: var(--text);
    }
    /* Ligne de saisie */
    .input-row {
      display: flex;
      align-items: center;
      border-top: 1px solid var(--border);
      padding: 8px 16px;
      gap: 8px;
      flex-shrink: 0;
    }
    .prompt { color: var(--green); flex-shrink: 0; }
    .input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: inherit;
      font-size: inherit;
      caret-color: var(--green);
    }
  </style>
</head>
<body>
  <div class="titlebar">
    <span class="logo">cmd&gt;</span>
    <span class="btns">
      <button class="btn btn-close" title="Fermer" onclick="window.close()">×</button>
    </span>
  </div>
  <div class="output" id="output"></div>
  <div class="suggest" id="suggest"></div>
  <div class="input-row">
    <span class="prompt">❯</span>
    <input class="input" id="input" type="text" autocomplete="off" spellcheck="false">
  </div>
  <script src="sidepanel.js"></script>
</body>
</html>
