<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Fond : dégradé sombre type terminal -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a6e3a1"/>
      <stop offset="100%" stop-color="#89b4fa"/>
    </linearGradient>
  </defs>

  <!-- Rectangle arrondi (icône Chrome) -->
  <rect x="4" y="4" width="120" height="120" rx="24" fill="url(#bg)" stroke="#45475a" stroke-width="2"/>

  <!-- Ligne 1 : prompt cmd> en vert -->
  <text x="24" y="52" font-family="ui-monospace, 'Cascadia Code', 'JetBrains Mono', Menlo, monospace"
        font-size="28" font-weight="bold" fill="url(#accent)">cmd&gt;</text>

  <!-- Curseur clignotant (barre verte) -->
  <rect x="82" y="32" width="4" height="24" rx="1" fill="#a6e3a1"/>

  <!-- Ligne 2 : texte subtil "shell" en grisé -->
  <text x="24" y="84" font-family="ui-monospace, 'Cascadia Code', 'JetBrains Mono', Menlo, monospace"
        font-size="18" fill="#6c7086">shell</text>

  <!-- Petit point accent en bas à droite -->
  <circle cx="104" cy="96" r="4" fill="#89b4fa"/>
</svg>
